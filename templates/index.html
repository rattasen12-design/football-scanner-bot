<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDedAi Pro Scanner - ระบบวิเคราะห์บอลอัตโนมัติ</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            color: #00e676;
            text-align: center;
            font-size: 24px;
            margin-bottom: 25px;
        }
        .match-card {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #00e676;
        }
        .match-info h3 {
            margin: 0 0 5px 0;
            font-size: 16px;
            color: #ffffff;
        }
        .match-info p {
            margin: 0;
            font-size: 13px;
            color: #b0b0b0;
        }
        .btn-scan {
            background-color: #00e676;
            color: #121212;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-scan:hover {
            background-color: #00c853;
        }
        #result-box {
            margin-top: 25px;
            background: #252525;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }
        #result-box h2 {
            color: #00e676;
            margin-top: 0;
            font-size: 20px;
        }
        .detail-item {
            margin: 8px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚽ TDedAi Pro Scanner</h1>
        <p style="text-align: center; color: #aaa; font-size: 14px; margin-bottom: 20px;">
            ระบบสแกนและวิเคราะห์สกอร์สูงอัตโนมัติด้วย AI Core Engine 7 ส่วน
        </p>

        <!-- รายการคู่แข่งขันจริงวันนี้จาก API -->
        <div style="margin-bottom: 20px;">
            <label style="font-weight: bold; color: #00e676; display: block; margin-bottom: 10px;">📋 เลือกคู่แข่งขันในโปรแกรมวันนี้ (สดจาก API):</label>
            
            {% for match in matches %}
            <div class="match-card">
                <div class="match-info">
                    <h3>{{ match.name }}</h3>
                    <p>{{ match.league }} • วิเคราะห์อัพเดทเรียลไทม์</p>
                </div>
                <button class="btn-scan" onclick="runScan('{{ match.name }}')">สแกนคู่นี้</button>
            </div>
            {% endfor %}
        </div>

        <!-- กล่องแสดงผลลัพธ์การวิเคราะห์แบบอัตโนมัติ -->
        <div id="result-box">
            <h2 id="res-match">ผลการวิเคราะห์</h2>
            <div class="detail-item"><b>เกรดความมั่นใจ:</b> <span id="res-grade" style="color: #00e676; font-size: 18px;">-</span></div>
            <div class="detail-item"><b>เปอร์เซ็นต์ความสำเร็จ:</b> <span id="res-conf">-</span></div>
            <div class="detail-item"><b>เกณฑ์ที่ผ่าน:</b> <span id="res-count">-</span></div>
            <hr style="border: 0; border-top: 1px solid #444; margin: 15px 0;">
            <div id="res-details" style="color: #ccc; font-size: 13px;"></div>
        </div>
    </div>

    <script>
        function runScan(matchName) {
            const resultBox = document.getElementById('result-box');
            resultBox.style.display = 'block';
            document.getElementById('res-match').innerText = "⏳ กำลังดึงข้อมูลและประมวลผล " + matchName + "...";
            document.getElementById('res-grade').innerText = "กำลังวิเคราะห์...";
            document.getElementById('res-conf').innerText = "-";
            document.getElementById('res-count').innerText = "-";
            document.getElementById('res-details').innerHTML = "";

            let formData = new FormData();
            formData.append('match_name', matchName);

            fetch('/scan', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('res-match').innerText = "📊 ผลวิเคราะห์: " + data.match_name;
                document.getElementById('res-grade').innerText = data.grade;
                document.getElementById('res-conf').innerText = data.confidence;
                document.getElementById('res-count').innerText = data.passed_count;
                
                let detailsHtml = "<b>รายละเอียดการประเมิน 7 ส่วน:</b><br>";
                data.details.forEach(item => {
                    detailsHtml += "• " + item + "<br>";
                });
                document.getElementById('res-details').innerHTML = detailsHtml;
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('res-match').innerText = "❌ เกิดข้อผิดพลาดในการเชื่อมต่อระบบ";
            });
        }
    </script>
</body>
</html>
