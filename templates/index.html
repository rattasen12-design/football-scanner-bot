<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Over Strategy Scanner (Dark Mode)</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            color: #00e676;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #b0bec5;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #00e676;
            color: #121212;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #00c853;
        }
        #result {
            margin-top: 20px;
            background: #252525;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .grade-box {
            font-size: 20px;
            font-weight: bold;
            color: #ff9100;
            margin-bottom: 10px;
        }
        ul {
            padding-left: 20px;
            font-size: 14px;
        }
        li {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>⚽ Football Over Scanner</h2>
    <form id="scanForm">
        <div class="form-group">
            <label>ชื่อลีก (รายการแข่งขันเฉพาะลีก):</label>
            <input type="text" name="league_name" value="Premier League">
        </div>
        <div class="form-group">
            <label>ค่าเฉลี่ยยิงในบ้าน (เจ้าบ้าน) / ยิงนอกบ้าน (ทีมเยือน):</label>
            <div style="display: flex; gap: 10px;">
                <input type="number" step="0.1" name="home_scored_home" value="1.6" placeholder="เจ้าบ้าน">
                <input type="number" step="0.1" name="away_scored_away" value="1.5" placeholder="ทีมเยือน">
            </div>
        </div>
        <div class="form-group">
            <label>ราคาเป้าหมายสูง (Target Odds):</label>
            <input type="number" step="0.25" name="target_odds" value="2.5">
        </div>
        <div class="form-group">
            <label>ฟอร์มรวมยิง 5 นัดล่าสุด & เสีย 5 นัดล่าสุด:</label>
            <div style="display: flex; gap: 10px;">
                <input type="number" step="0.1" name="form_5_goals_total" value="3.4" placeholder="ยิงรวม 5 นัด">
                <input type="number" step="0.1" name="form_5_conceded_total" value="2.1" placeholder="เสียรวม 5 นัด">
            </div>
        </div>
        <div class="form-group">
            <label>ค่า xG รวม:</label>
            <input type="number" step="0.1" name="xg_total" value="2.9">
        </div>
        
        <button type="button" onclick="runScan()">🔍 สแกนและวิเคราะห์ผล (Core Engine)</button>
    </form>

    <div id="result">
        <div class="grade-box" id="resGrade"></div>
        <p><strong>ความมั่นใจ:</strong> <span id="resConf"></span> (ผ่านเกณฑ์: <span id="resCount"></span>)</p>
        <hr style="border-color: #444;">
        <p><strong>รายละเอียดการตรวจสอบ 11 ข้อ:</strong></p>
        <ul id="resDetails"></ul>
    </div>
</div>

<script>
    function runScan() {
        const form = document.getElementById('scanForm');
        const formData = new FormData(form);

        fetch('/scan', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById('result').style.display = 'block';
            document.getElementById('resGrade').innerText = "เกรดผลลัพธ์: " + data.grade;
            document.getElementById('resConf').innerText = data.confidence;
            document.getElementById('resCount').innerText = data.passed_count;

            const detailsList = document.getElementById('resDetails');
            detailsList.innerHTML = '';
            data.details.forEach(item => {
                let li = document.createElement('li');
                li.innerText = item;
                detailsList.appendChild(li);
            });
        })
        .catch(error => {
            alert('เกิดข้อผิดพลาดในการเชื่อมต่อระบบ');
            console.error(error);
        });
    }
</script>

</body>
</html>
