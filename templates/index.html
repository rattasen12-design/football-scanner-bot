<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDedAi Pro: Over 7-Part Calculator</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 15px; }
        .container { max-width: 550px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,255,136,0.15); border: 1px solid #333; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h2 { color: #00ff88; margin: 5px 0; }
        .stats-box { background: #113322; border: 1px solid #00ff88; border-radius: 8px; padding: 10px; display: flex; justify-content: space-around; text-align: center; margin-bottom: 20px; font-size: 13px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: #aaa; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; box-sizing: border-box; }
        .upload-section { border: 2px dashed #00ff88; padding: 15px; border-radius: 8px; text-align: center; background: #182820; margin-bottom: 20px; }
        .btn-submit { background: #00ff88; color: #000; border: none; width: 100%; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s; }
        .btn-submit:hover { background: #00cc6a; }
        .result-panel { background: #222; border: 1px solid #00ff88; border-radius: 8px; padding: 15px; margin-top: 20px; display: none; }
        .badge { background: #ffaa00; color: #000; padding: 4px 10px; border-radius: 4px; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>⚽ TDedAi Pro Calculator</h2>
            <p style="font-size: 12px; color: #aaa;">ระบบประมวลผลสูตรบอลสูง 7 ส่วน (รองรับภาพหลายรูป & ฟอร์มตรวจสอบ)</p>
        </div>

        <div class="stats-box">
            <div>สถิติระบบรวม<br><b>{{ stats.total }} คู่</b></div>
            <div>แม่นยำสูง<br><b style="color: #00ff88;">{{ stats.accuracy }}</b></div>
        </div>

        <form id="calcForm" enctype="multipart/form-data">
            
            <div class="upload-section">
                <label style="color: #00ff88; font-weight: bold; margin-bottom: 8px;">📸 อัปโหลดรูปภาพแคปหน้าจอ (เลือกได้หลายรูปพร้อมกัน)</label>
                <!-- เพิ่มคำสั่ง multiple ตรงนี้เพื่อให้เลือกไฟล์รูปได้หลายรูป -->
                <input type="file" name="screenshot" accept="image/*" multiple style="background: transparent; border: none; color: #ccc;">
            </div>

            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label>ทีมเหย้า (Home)</label>
                    <input type="text" name="home_team" placeholder="เช่น โกรลุด" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>ทีมเยือน (Away)</label>
                    <input type="text" name="home_team" name="away_team" placeholder="เช่น โมสส์" required>
                </div>
            </div>

            <div class="form-group">
                <label>รายการลีก / การแข่งขัน</label>
                <input type="text" name="league" value="พรีเมียร์ลีกอังกฤษ" required>
            </div>

            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label>ยิงเฉลี่ยในบ้าน (5 นัด)</label>
                    <input type="number" step="0.1" name="home_scored" value="1.6" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>เสียเฉลี่ยนอกบ้าน (5 นัด)</label>
                    <input type="number" step="0.1" name="away_conceded" value="1.4" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>ช่องว่างราคาเป้าหมาย</label>
                    <input type="number" step="0.1" name="price_gap" value="0.5" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">🚀 รันสูตรวิเคราะห์ 7 ส่วนเต็มรูปแบบ</button>
        </form>

        <!-- แผงแสดงผลลัพธ์ -->
        <div class="result-panel" id="resultPanel">
            <h3 id="resName" style="margin-top: 0; color: #00ff88;">-</h3>
            <p style="font-size: 13px; margin: 4px 0;">🏆 ลีก: <span id="resLeague">-</span></p>
            <p style="font-size: 12px; color: #00ff88; margin: 4px 0;" id="resFilesInfo">-</p>
            <div style="display: flex; gap: 10px; margin: 15px 0;">
                <div style="flex: 1; background: #1a1a1a; padding: 10px; border-radius: 6px; text-align: center;">เกรดสูตร: <span class="badge" id="resGrade">-</span></div>
                <div style="flex: 1; background: #1a1a1a; padding: 10px; border-radius: 6px; text-align: center;">ความมั่นใจ: <b id="resConf" style="color:#00ff88;">-</b></div>
            </div>
            <p style="font-size: 13px; font-weight: bold; color: #ffaa00;" id="resPassed">-</p>
            <div style="font-size: 12px; background: #181818; padding: 12px; border-radius: 6px; line-height: 1.8;" id="resDetails">
                -
            </div>
        </div>
    </div>

    <script>
        document.getElementById('calcForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let formData = new FormData(this);

            fetch('/upload_and_scan', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('resultPanel').style.display = 'block';
                document.getElementById('resName').innerText = data.match_name;
                document.getElementById('resLeague').innerText = data.league;
                document.getElementById('resGrade').innerText = data.grade;
                document.getElementById('resConf').innerText = data.confidence;
                document.getElementById('resPassed').innerText = data.passed_count;
                document.getElementById('resFilesInfo').innerText = `📎 อัปโหลดรูปภาพเข้าระบบสำเร็จ: ${data.uploaded_count} รูป`;

                let detailsHtml = "";
                data.details.forEach(d => {
                    detailsHtml += `<p style="margin: 8px 0; border-bottom: 1px solid #333; padding-bottom: 8px;">${d}</p>`;
                });
                document.getElementById('resDetails').innerHTML = detailsHtml;

                document.getElementById('resultPanel').scrollIntoView({ behavior: 'smooth' });
            });
        });
    </script>
</body>
</html>
