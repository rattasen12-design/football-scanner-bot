<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>TDedAi API Inspector</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        input, button { padding: 12px; font-size: 16px; border-radius: 6px; border: 1px solid #444; background: #1e1e1e; color: #fff; margin-bottom: 10px; }
        button { background: #00ff80; color: #000; font-weight: bold; cursor: pointer; }
        pre { background: #1a1a1a; padding: 15px; border-radius: 6px; overflow-x: auto; color: #00ff80; border: 1px solid #333; }
    </style>
</head>
<body>
    <h2>🔍 ทดสอบดึงข้อมูลดิบจาก API-Football ตามสูตร 7 ส่วน</h2>
    <p>พิมพ์ชื่อทีมหรือคู่แข่งขัน เพื่อดึงข้อมูลจริงจากระบบ API มาแสดงผลตรวจสอบทีละข้อ</p>
    
    <div>
        <input type="text" id="teamInput" placeholder="พิมพ์ชื่อทีม (เช่น Arsenal)" style="width: 70%;">
        <button onclick="fetchApiData()">ดึงข้อมูลวิเคราะห์</button>
    </div>

    <h3>📋 ผลลัพธ์ข้อมูลดิบจาก API & สูตร 7 ส่วน:</h3>
    <pre id="resultBox">กำลังรอข้อมูล...</pre>

    <script>
        async function fetchApiData() {
            const teamName = document.getElementById('teamInput').value;
            document.getElementById('resultBox').innerText = "กำลังวิ่งไปดึงข้อมูลจาก API-Football...";
            
            try {
                const response = await fetch(`/analyze-raw?team=${encodeURIComponent(teamName)}`);
                const data = await response.json();
                document.getElementById('resultBox').innerText = JSON.stringify(data, null, 4);
            } catch (error) {
                document.getElementById('resultBox').innerText = "เกิดข้อผิดพลาด: " + error;
            }
        }
    </script>
</body>
</html>
