<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDedAi Pro - Football Over Scanner</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding-bottom: 70px;
        }
        .header {
            text-align: center;
            padding: 15px;
            background: #1e1e1e;
            border-bottom: 1px solid #333;
        }
        .header h2 {
            color: #00e676;
            margin: 0;
            font-size: 20px;
        }
        .container {
            max-width: 600px;
            margin: 15px auto;
            padding: 15px;
        }
        .card {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        h3 {
            color: #00e676;
            font-size: 16px;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            color: #b0bec5;
            font-size: 13px;
        }
        input, select {
            width: 100%;
            padding: 9px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #00e676;
            color: #121212;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        button:hover {
            background-color: #00c853;
        }
        .fixture-item {
            background: #252525;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .fixture-info {
            font-size: 13px;
        }
        .btn-sm {
            padding: 6px 12px;
            background: #00e676;
            color: #121212;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            width: auto;
        }
        #result {
            margin-top: 15px;
            background: #252525;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .grade-box {
            font-size: 18px;
            font-weight: bold;
            color: #ff9100;
            margin-bottom: 8px;
        }
        ul {
            padding-left: 18px;
            font-size: 13px;
        }
        li {
            margin-bottom: 4px;
        }
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #1a1a1a;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #333;
        }
        .nav-item {
            color: #aaa;
            font-size: 12px;
            text-align: center;
            text-decoration: none;
        }
        .nav-item.active {
            color: #00e676;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="header">
    <h2>⚽ TDedAi Pro Scanner</h2>
</div>

<div class="container">
    <!-- ตารางเลือกคู่แข่งขันด่วน -->
    <div class="card">
        <h3>📋 เลือกคู่แข่งขันในโปรแกรมวันนี้</h3>
        <div class="fixture-item">
            <div class="fixture-info">
                <strong>Arsenal vs Chelsea</strong><br>
                <span style="color: #888;">Premier League • ราคาเป้า: 2.5</span>
            </div>
            <button class="btn-sm" onclick="selectMatch('Arsenal vs Chelsea', 'Premier League', 2.5, 1.8, 1.4)">สแกนคู่นี้</button>
        </div>
        <div class="fixture-item">
            <div class="fixture-info">
                <strong>Real Madrid vs Barcelona</strong><br>
                <span style="color: #888;">La Liga • ราคาเป้า: 3.0</span>
            </div>
            <button class="btn-sm" onclick="selectMatch('Real Madrid vs Barcelona', 'La Liga', 3.0, 2.1, 1.9)">สแกนคู่นี้</button>
        </div>
    </div>

    <!-- ฟอร์มกรอกและปรับแต่งสถิติสำหรับสูตร 7 ส่วน -->
    <div class="card">
        <h3>⚙️ กำหนดค่าสถิติแกนกลาง (Core Engine)</h3>
        <form id="scanForm">
            <div class="form-group">
                <label>คู่แข่งขัน / รายการลีก:</label>
                <input type="text" id="league_name" name="league_name" value="Premier League (Arsenal vs Chelsea)">
            </div>
            <div class="form-group">
                <label>ยิงเฉลี่ย (เจ้าบ้านในบ้าน / ทีมเยือนนอกบ้าน):</label>
                <div style="display: flex; gap: 8px;">
                    <input type="number" step="0.1" id="home_scored_home" name="home_scored_home" value="1.8">
                    <input type="number" step="0.1" id="away_scored_away" name="away_scored_away" value="1.4">
                </div>
            </div>
            <div class="form-group">
                <label>ราคาเป้าหมายสูง (Target Odds):</label>
                <input type="number" step="0.25" id="target_odds" name="target_odds" value="2.5">
            </div>
            <div class="form-group">
                <label>ฟอร์มรวมยิง 5 นัด & เสีย 5 นัด:</label>
                <div style="display: flex; gap: 8px;">
                    <input type="number" step="0.1" name="form_5_goals_total" value="3.5">
                    <input type="number" step="0.1" name="form_5_conceded_total" value="2.0">
                </div>
            </div>
            <div class="form-group">
                <label>ค่า xG รวม:</label>
                <input type="number" step="0.1" name="xg_total" value="3.1">
            </div>
            
            <button type="button" onclick="runScan()">🔍 ประมวลผลสูตร 7 ส่วน (รันเกรด)</button>
        </form>

        <div id="result">
            <div class="grade-box" id="resGrade"></div>
            <p><strong>ความมั่นใจ:</strong> <span id="resConf"></span> (ผ่านเกณฑ์: <span id="resCount"></span>)</p>
            <hr style="border-color: #444;">
            <p><strong>รายละเอียดการตรวจสอบ:</strong></p>
            <ul id="resDetails"></ul>
        </div>
    </div>
</div>

<!-- แถบเมนูด้านล่าง -->
<div class="nav-bar">
    <a href="#" class="nav-item active">📊 ทำนายผล</a>
    <a href="#" class="nav-item">📅 ตารางแข่ง</a>
    <a href="#" class="nav-item">🔴 ผลบอลสด</a>
    <a href="#" class="nav-item">🏆 ตารางคะแนน</a>
</div>

<script>
    function selectMatch(matchName, league, odds, homeGoal, awayGoal) {
        document.getElementById('league_name').value = league + " (" + matchName + ")";
        document.getElementById('target_odds').value = odds;
        document.getElementById('home_scored_home').value = homeGoal;
        document.getElementById('away_scored_away').value = awayGoal;
        window.scrollTo({top: 400, behavior: 'smooth'});
    }

    function runScan() {
        const form = document.getElementById('scanForm');
        const formData = new FormData(form);

        fetch('/scan', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById('result').style.display = 'block';
            document.getElementById('resGrade').innerText = "เกรดผลลัพธ์: " + data.grade;
            document.getElementById('resConf').innerText = data.confidence;
            document.getElementById('resCount').innerText = data.passed_count;

            const detailsList = document.getElementById('resDetails');
            detailsList.innerHTML = '';
            data.details.forEach(item => {
                let li = document.createElement('li');
                li.innerText = item;
                detailsList.appendChild(li);
            });
        })
        .catch(error => {
            alert('เกิดข้อผิดพลาดในการเชื่อมต่อระบบ');
            console.error(error);
        });
    }
</script>

</body>
</html>
